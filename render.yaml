services:
  - type: web
    name: saas-pj-ia-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_DEFAULT_MODEL
        value: claude-sonnet-5
      # Origem(s) do frontend que pode chamar esta API (separadas por vírgula).
      - key: CORS_ALLOW_ORIGINS
        value: https://saas-pj-ia.vercel.app,https://saas-pj-ia-kchg.vercel.app,http://localhost:8080
      # Preenchidos manualmente no dashboard do Render (Environment) — nunca
      # commitados. Ver docs/ARCHITECTURE.md e .env.example.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
