<title>Empresas — SaaS Pré-Validação Empresarial</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">PV</div>
      <div>
        <div class="brand-name">Pré-Validação PE</div>
        <div class="brand-sub">Copiloto societário</div>
      </div>
    </div>
    <nav>
      <a href="dashboard.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a href="companies.html" class="active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="9" height="18" rx="1"/><rect x="13" y="8" width="7" height="13" rx="1"/><line x1="7" y1="7" x2="7" y2="7.01"/><line x1="10" y1="7" x2="10" y2="7.01"/><line x1="7" y1="11" x2="7" y2="11.01"/><line x1="10" y1="11" x2="10" y2="11.01"/></svg>Empresas</a>
      <a href="#" title="Abra um processo para enviar documentos"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M15 2v5h5"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>Documentos</a>
      <a href="#" title="Abra um processo para usar o assistente"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H6a2 2 0 0 1-2-2z"/></svg>Assistente IA</a>
      <a href="assinatura.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Assinatura</a>
      <a href="suporte.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><line x1="12" y1="16.5" x2="12" y2="16.51"/></svg>Suporte</a>
      <a href="admin.html" id="nav-admin" style="display: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>Admin</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <strong>Minhas Empresas</strong>
      <button id="logout-button" type="button">Sair</button>
    </div>

    <div class="panel">
      <h2>Nova empresa</h2>
      <form id="company-form">
        <div class="form-grid">
          <div>
            <label for="razao-social">Razão social *</label>
            <input id="razao-social" required />
          </div>
          <div>
            <label for="nome-fantasia">Nome fantasia</label>
            <input id="nome-fantasia" />
          </div>
          <div>
            <label for="cnpj">CNPJ</label>
            <input id="cnpj" placeholder="00.000.000/0000-00" />
          </div>
          <div>
            <label for="natureza-juridica">Natureza jurídica</label>
            <input id="natureza-juridica" placeholder="Ex.: LTDA" />
          </div>
          <div>
            <label for="municipio">Município</label>
            <input id="municipio" />
          </div>
          <div>
            <label for="uf">UF</label>
            <input id="uf" maxlength="2" value="PE" />
          </div>
          <div>
            <label for="capital-social">Capital social (R$)</label>
            <input id="capital-social" type="number" step="0.01" min="0" />
          </div>
        </div>
        <div class="form-actions">
          <button class="primary" type="submit" style="width: auto; margin-top: 0">Cadastrar</button>
        </div>
        <p class="error-message" id="form-error"></p>
      </form>
    </div>

    <div class="panel">
      <h2>Empresas cadastradas</h2>
      <div class="search-row">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="companies-search" type="text" placeholder="Buscar por razão social ou CNPJ" />
        </div>
      </div>
      <table id="companies-table">
        <thead>
          <tr>
            <th>Razão social</th>
            <th>CNPJ</th>
            <th>Município/UF</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="companies-body">
          <tr><td colspan="4">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const companiesBody = document.getElementById("companies-body");

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
  }

  const COMPANY_ICON =
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="3" width="9" height="18" rx="1"/><rect x="13" y="8" width="7" height="13" rx="1"/></svg>';

  let allCompanies = [];

  function renderCompanies(companies) {
    if (companies.length === 0) {
      companiesBody.innerHTML = '<tr><td colspan="4">Nenhuma empresa encontrada.</td></tr>';
      return;
    }
    companiesBody.innerHTML = companies
      .map(
        (c) => `
      <tr class="clickable" onclick="window.location.href='company.html?id=${c.id}'">
        <td><div class="row-title"><div class="company-ic">${COMPANY_ICON}</div>${escapeHtml(c.razao_social)}${c.nome_fantasia ? ` <span class="badge">${escapeHtml(c.nome_fantasia)}</span>` : ""}</div></td>
        <td>${escapeHtml(c.cnpj) || "—"}</td>
        <td>${escapeHtml(c.municipio) || "—"}${c.uf ? "/" + escapeHtml(c.uf) : ""}</td>
        <td class="chev">›</td>
      </tr>`
      )
      .join("");
  }

  async function loadCompanies() {
    try {
      allCompanies = await apiFetch("/companies");
      renderCompanies(allCompanies);
    } catch (err) {
      companiesBody.innerHTML = `<tr><td colspan="4">Erro ao carregar empresas: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.getElementById("companies-search").addEventListener("input", (event) => {
    const term = event.target.value.trim().toLowerCase();
    if (!term) {
      renderCompanies(allCompanies);
      return;
    }
    renderCompanies(
      allCompanies.filter(
        (c) =>
          c.razao_social.toLowerCase().includes(term) ||
          (c.cnpj || "").toLowerCase().includes(term)
      )
    );
  });

  document.getElementById("company-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById("form-error");
    errorEl.textContent = "";

    const capital = document.getElementById("capital-social").value;
    const payload = {
      razao_social: document.getElementById("razao-social").value.trim(),
      nome_fantasia: document.getElementById("nome-fantasia").value.trim() || null,
      cnpj: document.getElementById("cnpj").value.trim() || null,
      natureza_juridica: document.getElementById("natureza-juridica").value.trim() || null,
      municipio: document.getElementById("municipio").value.trim() || null,
      uf: document.getElementById("uf").value.trim() || null,
      capital_social: capital ? parseFloat(capital) : null,
    };

    try {
      const company = await apiFetch("/companies", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      window.location.href = `company.html?id=${company.id}`;
    } catch (err) {
      errorEl.textContent = err.message || "Não foi possível cadastrar a empresa.";
    }
  });

  (async () => {
    await requireSession();
    showAdminNavIfSuperAdmin();
    document.getElementById("logout-button").addEventListener("click", signOut);
    await loadCompanies();
  })();
</script>
